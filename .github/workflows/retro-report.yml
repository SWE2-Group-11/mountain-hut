name: Retrospective data report

on:
  workflow_dispatch:
    inputs:
      sprint:
        description: "Sprint name exactly as on the YouTrack board, e.g. Sprint 2"
        required: true
      code_ref:
        description: "Branch, tag or SHA whose tests are run (e.g. main or v2.0.0)"
        default: main
      run_tests:
        description: "Run unit, integration and E2E tests"
        type: boolean
        default: true

permissions:
  contents: read

env:
  RESULTS: ${{ github.workspace }}/test-results

jobs:
  tests:
    if: inputs.run_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code to test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        env:
          CODE_REF: ${{ inputs.code_ref }}
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
          mkdir -p "$RESULTS"
          echo "$CODE_REF ($(git rev-parse --short HEAD))" > "$RESULTS/ref.txt"

      # continue-on-error: failing tests must not stop the report, their numbers are part of it
      - name: Unit tests
        working-directory: backend
        continue-on-error: true
        run: >
          npx vitest run unit.test
          --reporter=json --outputFile="$RESULTS/unit.json"
          --coverage.enabled --coverage.reporter=json-summary
          --coverage.reportsDirectory="$RESULTS/unit-coverage"
          --coverage.include='src/**' --coverage.exclude='src/tests/**'

      - name: Integration tests
        working-directory: backend
        continue-on-error: true
        run: >
          npx vitest run integration.test
          --reporter=json --outputFile="$RESULTS/integration.json"
          --coverage.enabled --coverage.reporter=json-summary
          --coverage.reportsDirectory="$RESULTS/integration-coverage"
          --coverage.include='src/**' --coverage.exclude='src/tests/**'

      - name: Backend coverage, all tests
        working-directory: backend
        continue-on-error: true
        run: >
          npx vitest run
          --coverage.enabled --coverage.reporter=json-summary
          --coverage.reportsDirectory="$RESULTS/all-coverage"
          --coverage.include='src/**' --coverage.exclude='src/tests/**'

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: e2e
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.RESULTS }}/e2e.json
        run: npx playwright test --reporter=json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  report:
    needs: tests
    # Runs also when the tests are skipped or broken.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout script
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/retro-report/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/retro-report/requirements.txt

      - name: Download test results
        if: needs.tests.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Build report
        env:
          YOUTRACK_URL: ${{ vars.YOUTRACK_URL }}
          YOUTRACK_PROJECT: ${{ vars.YOUTRACK_PROJECT }}
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          SPRINT: ${{ inputs.sprint }}
        run: |
          tests=()
          [ -d test-results ] && tests=(--tests-dir test-results)
          python scripts/retro-report/retro_report.py --sprint "$SPRINT" "${tests[@]}" --out retro-report > /dev/null
          cat retro-report/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: retro-report
          path: retro-report/
          retention-days: 90