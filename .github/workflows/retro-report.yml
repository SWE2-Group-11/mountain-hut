name: Retrospective data report
run-name: Retrospective report - ${{ inputs.sprint }}

on:
  workflow_dispatch:
    inputs:
      sprint:
        description: "Sprint name exactly as on the YouTrack board, e.g. Sprint 2"
        required: true
      branch:
        description: "Branch whose last successful CI run provides the test results (main or dev)"
        default: main

permissions:
  contents: read
  actions: read   # to download the test results of a CI run

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout script
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/retro-report/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/retro-report/requirements.txt

      # The tests are not run again: the report uses the results of the last successful CI run.
      - name: Find last successful CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          run=$(gh run list --workflow ci.yml --branch "$BRANCH" --event push --status success --limit 1 \
                --json databaseId,headSha --jq '.[0] // empty | "\(.databaseId) \(.headSha[0:7])"')
          if [ -z "$run" ]; then
            echo "::warning::No successful CI run on $BRANCH: the report has no test results."
            exit 0
          fi
          read -r id sha <<< "$run"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          mkdir -p test-results
          echo "$BRANCH @ $sha (CI run $id)" > test-results/ref.txt

      - name: Download test results
        if: steps.ci.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          merge-multiple: true
          path: test-results/
          run-id: ${{ steps.ci.outputs.id }}
          github-token: ${{ github.token }}

      - name: Build report
        env:
          YOUTRACK_URL: ${{ vars.YOUTRACK_URL }}
          YOUTRACK_PROJECT: ${{ vars.YOUTRACK_PROJECT }}
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          SPRINT: ${{ inputs.sprint }}
        run: |
          python scripts/retro-report/retro_report.py --sprint "$SPRINT" --tests-dir test-results --out retro-report > /dev/null
          cat retro-report/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: retro-report-${{ inputs.sprint }}
          path: retro-report/
          retention-days: 90