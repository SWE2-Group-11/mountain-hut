name: Continuous Integration

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Linter (Oxlint)
        run: npx oxlint

      - name: Type-check Backend TypeScript
        run: npx tsc --noEmit

      # Unit and integration tests run separately to get the results and the coverage of each
      # suite: every test file must belong to one of the two, or it would not run at all.
      - name: Check Backend Test File Names
        run: |
          wrong=$(find src \( -name '*.test.*' -o -name '*.spec.*' \) ! -name '*.unit.test.ts' ! -name '*.integration.test.ts')
          if [ -n "$wrong" ]; then
            echo "::error::Test files must end with .unit.test.ts or .integration.test.ts"
            echo "$wrong"
            exit 1
          fi

      - name: Run Backend Unit Tests (Vitest)
        run: >
          npx vitest run unit.test
          --reporter=default --reporter=json --outputFile.json=../test-results/unit.json
          --coverage.enabled --coverage.reporter=text-summary --coverage.reporter=json-summary
          --coverage.reportsDirectory=../test-results/unit-coverage
          --coverage.include='src/**' --coverage.exclude='src/tests/**'

      - name: Run Backend Integration Tests (Vitest)
        # Runs also when the unit tests fail, so that all the failures are shown
        if: ${{ !cancelled() }}
        run: >
          npx vitest run integration.test
          --reporter=default --reporter=json --outputFile.json=../test-results/integration.json
          --coverage.enabled --coverage.reporter=text-summary --coverage.reporter=json-summary
          --coverage.reportsDirectory=../test-results/integration-coverage
          --coverage.include='src/**' --coverage.exclude='src/tests/**'

      # Used by the retrospective report (retro-report.yml)
      - name: Upload Backend Test Results
        if: ${{ !cancelled() }}
        continue-on-error: true   # a failed upload must not block the pipeline
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 90

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (Oxlint)
        run: npx oxlint

      - name: Type-check Frontend TypeScript
        run: npx tsc -b --noEmit

  e2e-ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix ../backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix ../frontend

      - name: Install E2E Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run Playwright E2E Tests
        run: npm test

      # Used by the retrospective report (retro-report.yml)
      - name: Upload E2E Test Results
        if: ${{ !cancelled() }}
        continue-on-error: true   # a failed upload must not block the pipeline
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/e2e.json
          retention-days: 90