services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_PATH: /app/data/database.sqlite
      CLIENT_ORIGIN: http://localhost:5173
      # Set to "true" to drop, recreate and seed the database at startup
      RESET_DB: ${RESET_DB:-false}
    volumes:
      - db-data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  db-data:
