services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_PATH: /app/data/database.sqlite
      CLIENT_ORIGIN: http://localhost:5173
      # Outgoing email goes to the Mailpit service below
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Set to "true" to drop, recreate and seed the database at startup
      RESET_DB: ${RESET_DB:-false}
    volumes:
      - db-data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      - mailpit
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

  # Development inbox: catches all emails, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  db-data:
