services:
  app:
    image: ghcr.io/swe2-group-11/mountain-hut:latest
    build: .
    container_name: mountain-hut
    volumes:
      - mountain-hut-data:/app/data
    ports:
      - "5173:5173" # frontend
      - "3000:3000" # REST API
      - "8025:8025" # Mailpit web UI
    restart: unless-stopped

volumes:
  mountain-hut-data:
    name: mountain-hut-data